<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>체험안내 | 스타듀밸리 x 상하목장 팝업스토어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>@import url('//fonts.googleapis.com/earlyaccess/jejugothic.css');</style>
<style>
  :root{
    --sky-pale:#cdefff;
    --wood-dark:#6b3f22;
    --wood-mid:#8a5a2f;
    --wood-light:#c9945a;
    --parchment:#f5e6c4;
    --ink:#3a2612;
    --label-blue:#0067a3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ min-height:100%; }
  body{
    font-family:'Pretendard', sans-serif;
    background:#e9e9e9;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  .page{
    width:100%;
    max-width:430px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--sky-pale);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:2.4vh 20px 1.6vh;
    flex:0 0 auto;
  }
  .logo img{ height:3.6vh; width:auto; display:block; min-height:26px; }
  .menu-btn{
    display:flex; flex-direction:column; gap:5px;
    background:none; border:none; cursor:pointer; padding:6px;
  }
  .menu-btn span{ width:24px; height:3px; background:#2a2a2a; border-radius:2px; }

  main{
    flex:1 1 auto;
    padding:6px 22px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .eyebrow{
    font-family:'Pretendard', sans-serif;
    font-weight:800;
    font-size:15px;
    letter-spacing:.03em;
    color:var(--label-blue);
    margin-bottom:10px;
  }
  h1{
    font-size:22px;
    font-weight:800;
    color:#1c1c1c;
    margin-bottom:14px;
  }
  .soon-badge{
    display:inline-block;
    background:var(--parchment);
    border:2px solid var(--wood-dark);
    border-radius:10px;
    padding:8px 18px;
    font-family:'Galmuri11', sans-serif;
    font-size:14px;
    color:var(--ink);
    margin-bottom:14px;
  }
  .lead-sub{
    font-size:13px;
    color:#5b6b78;
    line-height:1.6;
    margin-bottom:34px;
  }
  .back-btn-wrap{ display:flex; justify-content:center; }
  .back-btn{
    position:relative;
    width:64%;
    text-decoration:none;
    display:block;
  }
  .back-btn img{ width:100%; height:auto; display:block; }
  .back-btn span{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Pretendard', sans-serif;
    font-weight:800;
    font-size:15px;
    color:#2a1a0d;
    text-shadow:0 1px 0 rgba(255,255,255,.35);
  }
  .back-btn:active img{ filter:brightness(.94); }

  .grass-footer{
    flex:0 0 auto;
    width:100%;
    height:auto;
    display:block;
    margin-top:auto;
  }

  /* ===== NAV DRAWER ===== */
  .nav-overlay{
    position:fixed; inset:0;
    background:rgba(20,12,4,.5);
    opacity:0; visibility:hidden;
    transition:opacity .25s ease, visibility .25s ease;
    z-index:80;
  }
  .nav-overlay.open{ opacity:1; visibility:visible; }
  .nav-drawer{
    position:fixed; top:0; right:0;
    width:76%; max-width:300px;
    height:100%;
    background:linear-gradient(180deg, var(--sky-pale, #cdefff), #e6f6ff);
    border-left:5px solid var(--wood-dark);
    box-shadow:-8px 0 18px rgba(0,0,0,.25);
    transform:translateX(100%);
    transition:transform .28s ease;
    z-index:81;
    display:flex;
    flex-direction:column;
    padding:20px 18px;
  }
  .nav-drawer.open{ transform:translateX(0); }
  .nav-drawer-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
    padding-bottom:14px;
    border-bottom:3px solid var(--wood-dark);
  }
  .nav-drawer-header .nav-title{
    font-family:'Galmuri11', sans-serif;
    font-size:15px;
    color:var(--ink);
    letter-spacing:.05em;
  }
  .nav-close-btn{
    background:none; border:none; cursor:pointer;
    font-size:20px; line-height:1; color:var(--ink);
    padding:2px 6px;
  }
  .nav-list{ list-style:none; display:flex; flex-direction:column; }
  .nav-list li{ border-bottom:2px dashed #a9c3cf; }
  .nav-list a{
    display:flex; align-items:center; justify-content:space-between;
    text-decoration:none;
    padding:15px 4px;
    font-weight:800;
    font-size:13.5px;
    color:var(--ink);
  }
  .nav-list a .arrow{ color:var(--wood-mid); font-size:14px; }
  .nav-list a:active{ opacity:.6; }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo">
      <a href="index.html" style="display:flex; align-items:center;">
        <img src="images/sesac-logo-crop.png" alt="SESAC농부">
      </a>
    </div>
    <button class="menu-btn" aria-label="메뉴 열기">
      <span></span><span></span>
    </button>
  </header>

  <main>
    <p class="eyebrow">GUIDE</p>
    <h1>체험안내</h1>
    <span class="soon-badge">✦ COMING SOON ✦</span>
    <p class="lead-sub">팝업스토어에서 즐길 수 있는<br>체험 프로그램 안내를 준비 중이에요.<br>조금만 기다려주세요!</p>

    <div class="back-btn-wrap">
      <a href="pamphlet.html" class="back-btn">
        <img src="images/wood-button.png" alt="">
        <span>뒤로가기</span>
      </a>
    </div>
  </main>

  <img class="grass-footer" src="images/grass-strip.png" alt="">

  <!-- ===== NAV DRAWER ===== -->
  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav-drawer" id="navDrawer">
    <div class="nav-drawer-header">
      <span class="nav-title">MENU</span>
      <button class="nav-close-btn" id="navCloseBtn" aria-label="메뉴 닫기">✕</button>
    </div>
    <ul class="nav-list">
      <li><a href="pamphlet.html#story">STORY<span class="arrow">›</span></a></li>      <li><a href="festival.html">페스티벌 F&amp;B 및 굿즈<span class="arrow">›</span></a></li>
      <li><a href="festival.html#location">오시는 길 및 안내<span class="arrow">›</span></a></li>
    </ul>
  </nav>
</div>
<script>
  (function(){
    var menuBtn = document.querySelector('.menu-btn');
    var overlay = document.getElementById('navOverlay');
    var drawer = document.getElementById('navDrawer');
    var closeBtn = document.getElementById('navCloseBtn');
    function openNav(){ overlay.classList.add('open'); drawer.classList.add('open'); }
    function closeNav(){ overlay.classList.remove('open'); drawer.classList.remove('open'); }
    if(menuBtn) menuBtn.addEventListener('click', openNav);
    if(overlay) overlay.addEventListener('click', closeNav);
    if(closeBtn) closeBtn.addEventListener('click', closeNav);
  })();
</script>
</body>
</html>
